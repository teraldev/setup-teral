name: Set up Teral CLI
description: Install the Teral CLI so later steps can run `teral up`, `teral deploy`, and other commands.
author: Teral
branding:
  icon: upload-cloud
  color: purple

inputs:
  version:
    description: CLI version to install, e.g. 1.2.0. Defaults to the latest release.
    required: false
    default: latest

outputs:
  version:
    description: The installed CLI version.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          Windows) os=windows ;;
          *) echo "::error::Unsupported runner OS ${RUNNER_OS}"; exit 1 ;;
        esac
        case "${RUNNER_ARCH}" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::Unsupported runner architecture ${RUNNER_ARCH}"; exit 1 ;;
        esac

        version="${INPUT_VERSION#v}"
        if [ "$version" = "latest" ]; then
          version=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/teraldev/cli/releases/latest | jq -r .tag_name)
          version="${version#v}"
        fi

        ext=tar.gz
        [ "$os" = windows ] && ext=zip
        archive="teral_${version}_${os}_${arch}.${ext}"
        base="https://github.com/teraldev/cli/releases/download/v${version}"
        dir="${RUNNER_TEMP}/teral-${version}"
        mkdir -p "$dir"
        curl -fsSL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
        curl -fsSL -o "${RUNNER_TEMP}/checksums.txt" "${base}/checksums.txt"
        (cd "${RUNNER_TEMP}" && grep " ${archive}\$" checksums.txt | sha256sum --check --status) || {
          echo "::error::Checksum mismatch for ${archive}"; exit 1;
        }
        if [ "$ext" = zip ]; then
          unzip -q -o "${RUNNER_TEMP}/${archive}" -d "$dir"
        else
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "$dir"
        fi
        echo "$dir" >> "$GITHUB_PATH"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "Installed teral ${version}"
